          echo "Validating private key..."
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null

          echo "Adding server host key..."
          ssh-keyscan -T 10 -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

          echo "SSH setup completed."
