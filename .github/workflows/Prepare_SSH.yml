
name: Prepare_SSH

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "public/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_HOST"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null
          ssh-keyscan -T 10 -H "$SSH_HOST" >> "$HOME/.ssh/known_hosts"
          test -s "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy HOTEL over SSH
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            "$SSH_USER@$SSH_HOST" <<'EOF'
            set -euo pipefail
            cd /var/www/mshotel
            git pull --ff-only origin main
            cd /var/www/mshotel/server
            npm ci --omit=dev
            node --check app.js
            node --check mongo.js
            pm2 restart mshotel --update-env
            pm2 save
            curl --fail --silent --show-error http://127.0.0.1:3000/api/health
            echo "HOTEL deployment completed successfully."
          EOF

